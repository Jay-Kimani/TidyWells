name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Rebuild the generated site files
        run: |
          python posts/gen_didnt_work.py
          python posts/scorecard.py
          python posts/revisions.py
          python shop/build_shop.py
          python posts/build_feed.py
      - name: Check that every published number matches the data
        run: python posts/verify_site.py
      - name: Check the committed site is up to date
        run: git diff --exit-code -- docs ':(exclude)docs/data/manifest.json'
